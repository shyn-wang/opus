<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opus</title>
    <link rel="stylesheet" type="text/css" href="css/home.css"/>
</head>
<body>
    <nav>
        <div class="navBar">
            <div class="logo">
                <span class="logoText">Opus</span>
            </div>
            <div class="links">
                <a href="https://github.com/shyn-wang/opus" target="_blank">
                    <button class="githubBtn">
                        <img src="images/githubLogo.png" width="32" height="32">
                    </button>
                </a>
            </div>
        </div>
    </nav>
    <section class="main">
        <div class="blob blob1"></div>
        <div class="blob blob2"></div>
        <div class="blob blob3"></div>
        <div class="blob blob4"></div>
        <div id="parent">
            <div id="startScreen">
                <h2 id="title">Discover your taste in Classical Piano</h2>
                <button type = "button" class = "ButtonEnter" id="startBtn" onclick="modeSelector()">Start</button>
            </div>
        </div>
        <div id="modeSelectorScreen">
            <h2 id="title">Select a Mode</h2>
            <div class="container">
                <button type="button" class="ButtonEnter" id="era" onclick="startTest('eras')">Era</button>
                <button type="button" class="ButtonEnter" id="composer" onclick="startTest('composers')">Composer</button>
            </div>
        </div>
    </section>
    <script type="module" src="script.js"></script>
</body>
</html>
